# yolka — docker-compose quick start
# Brings up a yolka workspace container plus (optionally) the official
# Hermes agent container sharing the same ~/.hermes data directory.
#
# Usage:
#   docker compose up -d            # workspace only
#   docker compose up -d --profile hermes   # workspace + hermes agent

services:
  workspace:
    build: .
    image: yolka:latest
    container_name: yolka-workspace
    restart: unless-stopped
    volumes:
      - ~/.hermes:/home/agent/.hermes
      - ../:/repo:ro
    environment:
      - TZ=UTC
    command: ["sleep", "infinity"]

  hermes:
    image: nousresearch/hermes-agent:latest
    profiles: ["hermes"]
    container_name: yolka-hermes
    restart: unless-stopped
    volumes:
      - ~/.hermes:/opt/data
    ports:
      - "8642:8642"
    command: ["gateway", "run"]
