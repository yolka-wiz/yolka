model:
  default: deepseek-v4-flash
  provider: opencode-go
  base_url: https://opencode.ai/zen/go/v1
  api_mode: chat_completions
agent:
  max_turns: 150
  reasoning_effort: medium
web:
  backend: ddgs
  use_gateway: false
display:
  tool_progress: all
tts:
  use_gateway: false
gateway:
  platforms:
    api_server:
      enabled: false
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
mcp_servers:
  context7:
    url: https://mcp.context7.com/mcp
    headers:
      Authorization: "Bearer <CONTEXT7_KEY_FROM_SECRETS>"
