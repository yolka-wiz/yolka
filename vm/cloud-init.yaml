#cloud-config
# yolka — full VM install via cloud-init (for bare-metal / cloud providers that
# accept user-data: Hetzner, DigitalOcean, Linode, Proxmox, UTM, multipass...)
#
# Usage examples:
#   multipass launch ubuntu:24.04 --cloud-init vm/cloud-init.yaml --name yolka
#   proxmox / hetzner: paste this file into the "user data" field.
#
# After boot: ssh into the VM and run:
#   sudo bash /root/yolka/setup.sh   (if the repo is attached), or
#   follow README.md §Install for the manual flow.

package_update: true
packages:
  - curl
  - git
  - jq
  - unzip
  - ca-certificates
  - gnupg
  - lsb-release
  - build-essential
  - python3
  - python3-venv
  - python3-pip
  - openssh-client
  - sshpass
  - ansible-core
  - tesseract-ocr
  - poppler-utils
  - fonts-noto-arabic

runcmd:
  # 1. Hermes
  - curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
  # 2. Note: repo checkout + identity copy is intentionally NOT automated here,
  #    because the repo URL/auth varies per user. After first boot:
  #      git clone <your-yolka-repo-url> /root/yolka
  #      cd /root/yolka && bash vm/setup.sh
  - echo "yolka VM ready. Next: git clone your yolka repo, run vm/setup.sh" > /root/README.txt

final_message: "yolka VM provisioned. See /root/README.txt"
